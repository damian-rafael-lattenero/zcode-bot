# F54c: mypy configuration. REPORT-ONLY for now — the annotated public
# surface (core, workers, reasoning, live_view, state/registry, audit,
# config) should stay clean; the long tail is baselined in
# docs/TECH_DEBT.md and blocking is decided once the tree is clean.
[mypy]
python_version = 3.13
# stdlib-only runtime: the one third-party import is aiohttp (telegram
# client) — no stubs needed for a report-only pass
ignore_missing_imports = True
# entities use class-attribute defaults and dynamic dict shapes on
# purpose (compat mappings) — do not fight them yet
allow_redefinition = True
no_strict_optional = True
files = src/zcode_bot
